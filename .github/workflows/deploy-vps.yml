name: Deploy to VPS

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'scripts/**'
      - '.github/workflows/deploy-vps.yml'
  workflow_dispatch:
    inputs:
      deploy_mode:
        description: 'Deploy mode'
        required: true
        default: bot
        type: choice
        options:
          - bot
          - full

concurrency:
  group: deploy-vps-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail
            export APP_DIR="${{ secrets.VPS_APP_DIR || '/opt/delala' }}"
            export DEPLOY_MODE="${{ github.event.inputs.deploy_mode || secrets.VPS_DEPLOY_MODE || 'bot' }}"
            bash "$APP_DIR/scripts/vps-deploy.sh"
