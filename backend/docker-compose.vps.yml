# VPS production overlay: bind-mount uploads so nginx can serve /var/www/delala/uploads/
# Usage: docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d --build

services:
  api:
    ports:
      - "127.0.0.1:${API_PORT:-5000}:5000"
    volumes:
      - /var/www/delala/uploads:/app/uploads
      - logs:/app/logs

  bot:
    volumes:
      - /var/www/delala/uploads:/app/uploads
      - logs:/app/logs
