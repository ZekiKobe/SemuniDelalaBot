upstream delala_api {
    least_conn;
    server 127.0.0.1:5000;
    keepalive 64;
}

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    server_name api.delala.et;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.delala.et;

    ssl_certificate /etc/letsencrypt/live/api.delala.et/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.delala.et/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 10M;

    location /uploads/ {
        alias /var/www/delala/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://delala_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }

    location /health {
        proxy_pass http://delala_api/api/v1/health;
    }
}
