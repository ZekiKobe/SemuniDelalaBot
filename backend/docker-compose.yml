# Production stack for Delala backend.
#
# Quick start (MongoDB Atlas or other external DB):
#   cp .env.example .env   # fill in secrets
#   docker compose up -d --build
#
# With a local MongoDB container:
#   docker compose --profile local-db up -d --build
#
# Services:
#   api  - HTTP API on port 5000 (ENABLE_TELEGRAM_POLLING=false)
#   bot  - Telegram bot worker (polling only; single replica)

name: delala

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: delala-api:latest
    container_name: delala-api
    restart: unless-stopped
    command: node src/server.js
    env_file:
      - .env
    environment:
      NODE_ENV: production
      ENABLE_TELEGRAM_POLLING: "false"
      UPLOAD_DIR: /app/uploads
      LOG_DIR: /app/logs
    ports:
      - "${API_PORT:-5000}:5000"
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    networks:
      - delala
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/api/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: delala-api:latest
    container_name: delala-bot
    restart: unless-stopped
    command: node start-bot.js
    env_file:
      - .env
    environment:
      NODE_ENV: production
      ENABLE_TELEGRAM_POLLING: "false"
      UPLOAD_DIR: /app/uploads
      LOG_DIR: /app/logs
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    networks:
      - delala
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  mongo:
    profiles:
      - local-db
    image: mongo:7
    container_name: delala-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DB_NAME:-delala}
    volumes:
      - mongo_data:/data/db
    networks:
      - delala
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Do not publish MongoDB to the host in production.
    # Set MONGODB_URI=mongodb://mongo:27017/delala in .env when using this profile.

networks:
  delala:
    driver: bridge

volumes:
  mongo_data:
  uploads:
  logs:
