# Production base stack (external MongoDB — set MONGODB_URI in .env).
#
#   docker compose up -d --build
#
# Local dev: docker-compose.override.yml is merged automatically (adds MongoDB).

name: delala

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: delala-api:latest
    container_name: delala-api
    restart: unless-stopped
    command: node src/server.js
    env_file:
      - .env
    environment:
      NODE_ENV: production
      ENABLE_TELEGRAM_POLLING: "false"
      UPLOAD_DIR: /app/uploads
      LOG_DIR: /app/logs
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${API_PORT:-5000}:5000"
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    networks:
      - delala
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/api/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: delala-api:latest
    container_name: delala-bot
    restart: unless-stopped
    command: node start-bot.js
    env_file:
      - .env
    environment:
      NODE_ENV: production
      ENABLE_TELEGRAM_POLLING: "false"
      UPLOAD_DIR: /app/uploads
      LOG_DIR: /app/logs
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    networks:
      - delala
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  delala:
    driver: bridge

volumes:
  uploads:
  logs:
