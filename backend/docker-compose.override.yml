# Local development overrides (merged automatically with docker-compose.yml).
#
#   docker compose up -d --build
#
# On production servers, do NOT deploy this file.

services:
  mongo:
    image: mongo:7
    container_name: delala-mongo-dev
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DB_NAME:-delala}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data_dev:/data/db
    networks:
      - delala
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    image: delala-api:dev
    container_name: delala-api-dev
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/${MONGODB_DB_NAME:-delala}
      LOG_LEVEL: debug
      API_URL: http://localhost:${API_PORT:-5000}
    volumes:
      - uploads_dev:/app/uploads
      - logs_dev:/app/logs
    depends_on:
      mongo:
        condition: service_healthy
    deploy: !reset null

  bot:
    image: delala-api:dev
    container_name: delala-bot-dev
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/${MONGODB_DB_NAME:-delala}
      LOG_LEVEL: debug
    volumes:
      - uploads_dev:/app/uploads
      - logs_dev:/app/logs
    deploy: !reset null

volumes:
  mongo_data_dev:
  uploads_dev:
  logs_dev:
