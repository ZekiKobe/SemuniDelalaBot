# Local development stack (Docker on localhost).
#
#   docker compose -f docker-compose.dev.yml up --build
#   docker compose -f docker-compose.dev.yml up -d --build
#
# Includes MongoDB. API uses NODE_ENV=development.
# MONGODB_URI is set to the mongo service — do not use localhost in .env for Docker.

name: delala-dev

services:
  mongo:
    image: mongo:7
    container_name: delala-mongo-dev
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DB_NAME:-delala}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data_dev:/data/db
    networks:
      - delala
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: delala-api:dev
    container_name: delala-api-dev
    restart: unless-stopped
    command: node src/server.js
    env_file:
      - .env
    environment:
      NODE_ENV: development
      ENABLE_TELEGRAM_POLLING: "false"
      MONGODB_URI: mongodb://mongo:27017/${MONGODB_DB_NAME:-delala}
      UPLOAD_DIR: /app/uploads
      LOG_DIR: /app/logs
      LOG_LEVEL: debug
      API_URL: http://localhost:${API_PORT:-5000}
    ports:
      - "${API_PORT:-5000}:5000"
    volumes:
      - uploads_dev:/app/uploads
      - logs_dev:/app/logs
    networks:
      - delala
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/api/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: delala-api:dev
    container_name: delala-bot-dev
    restart: unless-stopped
    command: node start-bot.js
    env_file:
      - .env
    environment:
      NODE_ENV: development
      ENABLE_TELEGRAM_POLLING: "false"
      MONGODB_URI: mongodb://mongo:27017/${MONGODB_DB_NAME:-delala}
      UPLOAD_DIR: /app/uploads
      LOG_DIR: /app/logs
      LOG_LEVEL: debug
    volumes:
      - uploads_dev:/app/uploads
      - logs_dev:/app/logs
    networks:
      - delala
    depends_on:
      api:
        condition: service_healthy

networks:
  delala:
    driver: bridge

volumes:
  mongo_data_dev:
  uploads_dev:
  logs_dev:
